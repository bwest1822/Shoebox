async function writeUp(pid) {
  const sample = S.sample, page = S.pages[pid];
  if (!sample) { toast('Auto write-up isn’t available here. You can still write your own words.'); return; }
  const its = S.items[pid] || [];
  const photos = its.filter(i => i.kind === 'photo').sort((a, b) => (a.y - b.y) || (a.x - b.x));
  const notes = (S.diary[pid] || []).map(e => `- ${e.text}`).join('\n');
  const words = its.filter(i => i.kind === 'text' && !i.role).map(i => i.text).join(' / ');
  const quotes = its.filter(i => i.kind === 'quote').map(q => `"${q.text}" (${q.who || 'kid'}${q.age ? ', ' + q.age : ''})`).join('; ');
  if (!photos.length && !notes && !quotes) { toast('Add a few photos or diary notes first, then I’ll write it up.'); return; }
  toast('Writing it up…');
  try {
    let images;
    const lim = await sample.limits().catch(() => null);
    if (lim && lim.images && photos.length) {
      const urls = await Promise.all(photos.slice(0, lim.images.maxCount).map(p => S.photoThumb[p.photo] || loadPhoto(p.photo, 'thumb')));
      images = urls.filter(Boolean).map(dataUrlToBlob);
    }
    const seen = images && images.length;
    const kind = (MOMENTS.find(m => m.id === page.kind) || {}).name || 'weekend';
    const prompt = `You write the words for a scrapbook page about real life, in a playful 90s-scrapbook spirit. This page is: ${kind}. Voice: warm, funny, casual, first person, like gel-pen notes. Real life over perfection: celebrate the mess, the goofy moments and the bloopers. Never invent specific facts (place names, people's names, events) that aren't in the notes or clearly visible in the photos.

Diary notes:
${notes || '(none)'}
${words ? `Words already on the page: ${words}\n` : ''}${quotes ? `Kid quotes saved on the page: ${quotes}\n` : ''}
${seen ? `I attached ${images.length} photos in page order.` : `There are ${photos.length} photos you can't see; write captions that follow the notes in order.`}

Reply with only JSON in this shape:
{"title":"...","captions":["..."],"summary":"...","best":"...","rating":8.5,"grades":[["Fun","A"],["Snacks","B+"],["Chill","A-"],["Chaos","C"]],"comment":"..."}

Rules:
- title: 2 to 6 words, catchy, lowercase is fine
- captions: exactly ${photos.length} items, each 1 to 5 words, like a label on the back of a photo (a photo framed as a blooper gets a self-deprecating caption)
- summary: 2 short sentences, 200 characters max
- best: 2 to 8 words, the best moment
- rating: 1 to 10 in steps of 0.5
- grades: exactly 4 report-card subjects that fit this page (1 or 2 words each) with letter grades like A+, B-, F
- comment: one teacher-style comment, 4 to 10 words, playful`;
    const out = await sample.json(prompt, seen ? { images } : {});
    const t = now(), upd = { updatedAt: t, developedAt: t };
    if (out.title) upd.title = String(out.title).slice(0, 60);
    if (out.summary) upd.summary = String(out.summary).slice(0, 240);
    if (out.best) upd.best = String(out.best).slice(0, 80);
    if (out.rating != null && !isNaN(+out.rating)) upd.rating = Math.round(+out.rating * 2) / 2;
    await safe(Store.update(`pages/${pid}`, upd)); Object.assign(page, upd);
    const tItem = its.find(i => i.role === 'title');
    if (upd.title) { if (tItem) { tItem.text = upd.title; await Store.update(`pages/${pid}/items/${tItem.id}`, { text: upd.title }); } else await addItemTo(pid, { kind: 'text', role: 'title', text: upd.title, style: 'pen', font: 'marker', color: INK, fs: 76, x: 450, y: 120, w: 800, r: -2 }); }
    if (Array.isArray(out.captions)) for (let i = 0; i < photos.length; i++) if (out.captions[i] && (!photos[i].caption || photos[i].caption === 'blooper reel')) { photos[i].caption = String(out.captions[i]).slice(0, 40); await Store.update(`pages/${pid}/items/${photos[i].id}`, { caption: photos[i].caption }); }
    const grades = Array.isArray(out.grades) ? out.grades.slice(0, 5).map(g => Array.isArray(g) ? [String(g[0]).slice(0, 14), String(g[1]).slice(0, 3)] : [String(g.subject || g.name || ''), String(g.grade || '')]) : [];
    if (upd.rating != null) grades.push(['Overall', upd.rating + '/10']);
    const rep = its.find(i => i.role === 'report'), rdata = { grades, comment: String(out.comment || upd.best || '').slice(0, 80) };
    if (rep) { Object.assign(rep, rdata); await Store.update(`pages/${pid}/items/${rep.id}`, rdata); }
    else await addItemTo(pid, { kind: 'report', role: 'report', ...rdata, x: 820, y: 1120, w: 320, r: 3 });
    S.items[pid] = [...(S.items[pid] || [])];
    onPageData(pid, 'items'); scheduleRender();
    toast('Written up. Tweak anything you like.');
  } catch (e) {
    toast({ not_granted: 'The write-up needs your OK to use Claude. Reload to be asked again.', rate_limited: 'Too many requests at once. Try again in a minute.', invalid_json: 'The write-up came back garbled. Try again.' }[e && e.code] || 'Couldn’t write it up just now. Try again.');
  }
}

function faceCover(url, name) {

          x.save(); x.shadowColor = '#fff'; x.shadowBlur = 0; x.lineWidth = k.s * .12; x.strokeStyle = '#fff';

  S.me = me; S.sample = sample; S.downloads = downloads;
  try { S.guest = localStorage.getItem('shoebox-guest') === '1'; } catch { }
  if (canWrite === false) S.guest = true; // view-only visitors (like grandparents) get the family view
  let first;
  const ready = new Promise(r => first = r);
  Store.watch('profiles', l => { S.profiles = Object.fromEntries(l.map(p => [p.id, p])); first(); scheduleRender(); });
  Store.watch('follows', l => { S.follows = l; scheduleRender(); });
  Store.watch('pages', l => { S.pages = Object.fromEntries(l.map(p => [p.id, p])); scheduleRender(); });
  Store.watch('reactions', l => { S.reactions = l; scheduleRender(); });
  Store.watch('interest', l => { S.interest = l; scheduleRender(); });
  Store.watch('circles', l => { S.circles = l; scheduleRender(); });
  await Promise.race([ready, new Promise(r => setTimeout(r, 6000))]);
  S.ready = true;
  window.addEventListener('hashchange', () => View.route());
  View.route();
  if (Store.mode === 'local') setTimeout(() => toast('Preview mode: your pages stay on this device.'), 800);
})();

</script>
